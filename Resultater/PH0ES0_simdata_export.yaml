- GDXReader:
    file: C:\Jordmod_Landwell\Resultater\PH0ES0_simdata.gdx
    symbols: 
      - name: SIMDATA
- Filter:
    name: SIMDATA
    newName: SIMDATA_filter_
    labelFilters:
      - column: 1
        reject: ['NORGE', 'NORD', 'MIDT', 'VEST', 'SOER', 'OEST']
      - column: 3
        keep: ['FGRV']
- ExcelWriter:
    file: C:\Jordmod_Landwell\resultater\PH0ES0_simdata_export.xlsx
    valueSubstitutions: {
      EPS: EPS,
      INF: INF,
      -INF: -INF,
      UNDEF: UNDEF,
      NA: NA
    }
    symbols:
      - name: SIMDATA_filter_
        range: SIMDATA!A1
        columnDimension: 0
